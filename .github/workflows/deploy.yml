name: Deploy Web OS Desktop

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Bumped to current standard

      - name: Install Dependencies
        run: npm install    # This will generate the missing lockfile automatically on the runner

      - name: Build Desktop Layout
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
